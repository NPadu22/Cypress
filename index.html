<style id="cy-style">
/* Concept: "Stay Charged." Chargers -> charge. A five-cell gold charge meter is the signature. Sport field markings sit behind every screen.
   Cypress blue + gold only. Type per the Cypress College identity page. Uses "Cypress Chargers" wording; no horse-head mark (reserved, needs Campus Communications approval). */
/* Cypress College Identity Guide (2018): Premier Gold #FED41F (PMS 116) + Charger Blue #003876 (PMS 281) are the base.
   Accents from the guide: Modern Cyan #00AEEF, Modern Blue #1C75BC, Piazza Blue #4F728F, Cement Gray #B6B2A3, Tile Red #ED1C24, Tile Brown #614219, Nature Green #366B34.
   Avoided per guide: Charger Blue + Modern Gold (#FBB040). Max four colors per scheme. Gold diamond is the recurring shape, echoing the guide's diamond swatches. */
:root{
  --bg:#001B3D; --surface:#003876; --surface-2:#0A4A8E; --line:#1E5694; --fg:#FFFFFF; --muted:#C9C6BA;
  --gold:#FED41F; --gold-text:#FED41F; --on-gold:#003876; --navy:#003876;
  --ok:#6FAF6B; --warn:#FED41F; --stop:#FF5A60; --info:#00AEEF;
  /* Type: the college's two primary families (Identity Guide): Calisto MT for display, Trebuchet MS for text.
     Phones without them fall back to Sorts Mill Goudy (old-style serif) and Fira Sans (humanist sans), loaded from Google Fonts. */
  --display:"Calisto MT","Sorts Mill Goudy","Goudy Old Style",Georgia,serif; --body:"Trebuchet MS","Fira Sans",Roboto,Arial,sans-serif; --mono:"Trebuchet MS","Fira Sans",Arial,sans-serif;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme]){ --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#ECEAE3; --line:#D3CFC2; --fg:#003876; --muted:#4F728F; --gold-text:#614219; --info:#1C75BC; --stop:#C8161D; --ok:#366B34; color-scheme:light } }
:root[data-theme="midnight"]{ --bg:#000C1F; --surface:#00234C; --surface-2:#003876; --line:#134680 }
:root[data-theme="goldrush"]{ --bg:#FFF4C2; --surface:#FFFBEA; --surface-2:#FEE98A; --line:#E9CF5C; --fg:#003876; --muted:#4F728F; --gold:#003876; --gold-text:#003876; --on-gold:#FED41F; --info:#1C75BC; --stop:#C8161D; --ok:#366B34; color-scheme:light }
:root[data-theme="cyan"]{ --bg:#00213F; --surface:#003876; --surface-2:#0A4A8E; --line:#1F5E99; --fg:#FFFFFF; --muted:#C9D8E6; --gold:#00AEEF; --gold-text:#5FD0FF; --on-gold:#001B3D; --info:#FED41F; --stop:#FF5A60; --ok:#6FAF6B; color-scheme:dark }
:root[data-theme="modernblue"]{ --bg:#0B2F55; --surface:#1C75BC; --surface-2:#2A86CF; --line:#4F9AD6; --fg:#FFFFFF; --muted:#E2ECF5; --gold:#FFF200; --gold-text:#FFF200; --on-gold:#003876; --info:#00AEEF; --stop:#FF8A8F; --ok:#9BD39A; color-scheme:dark }
:root[data-theme="piazza"]{ --bg:#1D364D; --surface:#2C4D69; --surface-2:#4F728F; --line:#6A8BA6; --fg:#FFFFFF; --muted:#DAD7CC; --gold:#FED41F; --gold-text:#FED41F; --on-gold:#003876; --info:#7FD3F7; --stop:#FF7A7F; --ok:#8CC489; color-scheme:dark }
:root[data-theme="tile"]{ --bg:#EFEBE2; --surface:#FBFAF6; --surface-2:#E3DED1; --line:#B6B2A3; --fg:#003876; --muted:#614219; --gold:#003876; --gold-text:#614219; --on-gold:#FED41F; --info:#4F728F; --stop:#C8161D; --ok:#366B34; color-scheme:light }
:root[data-theme="tilered"]{ --bg:#001B3D; --surface:#003876; --surface-2:#0A4A8E; --line:#1E5694; --fg:#FFFFFF; --muted:#C9C6BA; --gold:#ED1C24; --gold-text:#FF7A7F; --on-gold:#FFFFFF; --info:#FED41F; --stop:#FF9EA2; --ok:#6FAF6B; color-scheme:dark }
:root[data-theme="light"]{ --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#ECEAE3; --line:#D3CFC2; --fg:#003876; --muted:#4F728F; --gold-text:#614219; --info:#1C75BC; --stop:#C8161D; --ok:#366B34; color-scheme:light }
:root[data-large="1"]{font-size:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance}
h1{font-size:2.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700;letter-spacing:0;display:flex;align-items:center;gap:10px}
h2::before{content:"";flex:none;width:11px;height:11px;background:var(--gold);transform:rotate(45deg);margin:0 3px}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--gold-text)}
.eyebrow{font:700 .7rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem} .stamp{font:.7rem var(--mono);color:var(--muted)}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .25s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
section{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.card{background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px 14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.wordmark{display:flex;align-items:center;gap:10px;font:700 1.3rem/1 var(--display);letter-spacing:.04em}
.wordmark small{display:block;font:600 .6rem/1.3 var(--mono);letter-spacing:.16em;color:var(--muted)}
.bolt{color:var(--on-gold);width:30px;height:30px;border-radius:5px;background:var(--gold);display:grid;place-items:center;flex:none;transform:rotate(45deg)}
.bolt svg{transform:rotate(-45deg)}
.bolt svg{width:16px;height:16px}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font:700 .95rem var(--display);cursor:pointer}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 18px 18px;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 60%),
  linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;opacity:.07;background:var(--gold);
  clip-path:polygon(58% 0,18% 56%,46% 56%,34% 100%,82% 38%,54% 38%,70% 0)}
/* charge meter: the signature */
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative;padding-right:12px}
.meter::after{content:"";position:absolute;right:0;top:30%;width:7px;height:40%;border-radius:0 3px 3px 0;background:var(--line)}
.meter.full::after{background:var(--gold)}
.cell{height:34px;border-radius:6px;border:1.5px solid var(--line);background:transparent;cursor:pointer;position:relative;transition:background .2s,border-color .2s}
.cell[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 40%,transparent)}
.cell span{position:absolute;inset:auto 0 -20px;font:600 .58rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meterwrap{padding-bottom:22px}
.pct{font:800 2.6rem/1 var(--display)}
.pct small{font-size:1rem;color:var(--muted);font-weight:600}
/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .72rem/1 var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.stop{border-color:color-mix(in srgb,var(--stop) 60%,transparent);color:var(--stop)}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.chip.gold{border-color:color-mix(in srgb,var(--gold) 70%,transparent);color:var(--gold-text)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:0;background:var(--gold);color:var(--on-gold);font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--gold-text);text-decoration:underline;cursor:pointer}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button,.choice button{flex:none;min-height:38px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"],.choice button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.choice{display:flex;flex-wrap:wrap;gap:6px}
/* forms */
label{display:flex;flex-direction:column;gap:6px;font:600 .68rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:16px var(--body);text-transform:none;letter-spacing:0;color:var(--fg)}
textarea{min-height:90px;resize:vertical}
/* timeline */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-item{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:14px;position:relative}
.tl-item::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:22px;height:22px;border-radius:6px;border:2px solid var(--gold);background:var(--bg);margin-top:2px}
.tl-item b{display:block;font-family:var(--display);font-size:1.18rem;font-weight:700;letter-spacing:0}
/* lists */
.place{display:flex;flex-direction:column;gap:8px}
.place.flag{border-color:color-mix(in srgb,var(--stop) 55%,var(--line))}
.order{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.95rem}
.order .eyebrow{padding-top:4px}
details{background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:12px}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:700 1.2rem/1 var(--display);color:var(--gold-text)}
details[open] summary::after{content:"–"}
.ans{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.src{font:.72rem/1.4 var(--mono);color:var(--muted)}
.stopbox{border:1.5px solid var(--stop);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--stop) 7%,var(--surface))}
.alertbox{border-left:4px solid var(--stop);background:color-mix(in srgb,var(--stop) 7%,var(--surface));border-radius:10px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:8px}
.goldbox{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface));border-radius:10px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:8px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.copybox{font:.86rem/1.5 var(--mono);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word}
.sportgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sportbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:74px}
.sportbtn b{font:700 1.15rem/1.05 var(--display)}
.sportbtn.mine{border-color:var(--gold)}
.entry{display:flex;flex-direction:column;gap:6px}
.entry img{border-radius:10px;max-height:220px;object-fit:cover;width:100%}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ann{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--gold);padding:2px 0 2px 12px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:2px}
.tabs button{min-width:0;background:none;border:0;padding:6px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font:600 .66rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:10px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--gold-text)}
.tabs-in.many button{font-size:.56rem;letter-spacing:.02em}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-current="page"] svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--gold) 50%,transparent))}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
.ed{border-style:dashed}
/* poster: flat, print-like, Charger Blue + Premier Gold */
.poster{--p-gold:#FED41F;position:relative;aspect-ratio:3/4;width:100%;background:#003876;color:#fff;border-radius:6px;overflow:hidden;container-type:inline-size;font-family:var(--body)}
.poster-bg{position:absolute;inset:0;display:flex;justify-content:center}
.poster-bg svg{width:100%;height:100%}
.poster-bg .l{fill:none;stroke:#fff;stroke-width:2;opacity:.16}
.poster-bg .g,.poster-bg .g.d{fill:none;stroke:#FED41F;stroke-width:2.5;opacity:.45}
.poster-bg .gf{fill:#FED41F;opacity:.45}
.poster-bg .f{fill:#fff;opacity:.08}
.poster-bg .d{stroke-dasharray:6 8}
.poster-bg text{font:900 44px var(--display);fill:#fff;opacity:.1}
.poster-in{position:relative;height:100%;display:flex;flex-direction:column;gap:2.6cqw;padding:5.5cqw 6cqw 5cqw}
.p-kicker{font:700 3cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#FED41F;display:flex;align-items:center;gap:2cqw}
.p-dia{width:2.4cqw;height:2.4cqw;background:#FED41F;transform:rotate(45deg);display:inline-block}
.p-title{font:700 13cqw/.92 var(--display);color:#FED41F;display:block;letter-spacing:-.01em}
.p-title::before{display:none}
.p-rules{list-style:none;margin:0;padding:0;counter-reset:r;display:flex;flex-direction:column;gap:2cqw}
.p-rules li{counter-increment:r;display:grid;grid-template-columns:7cqw 1fr;gap:2.4cqw;align-items:center;font:700 4.1cqw/1.2 var(--body)}
.p-rules li::before{content:counter(r);width:6cqw;height:6cqw;background:#FED41F;color:#003876;transform:rotate(45deg);display:grid;place-items:center;font:900 3.4cqw var(--display)}
.p-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:auto}
.p-cols div{background:rgba(0,27,61,.75);border-top:1cqw solid #FED41F;padding:2.4cqw;display:flex;flex-direction:column;gap:1.2cqw}
.p-cols b{font:700 4cqw/1 var(--display);color:#FED41F}
.p-cols span{font:500 3cqw/1.25 var(--body)}
.p-plate{display:flex;gap:4cqw;align-items:center}
.p-plate .plate{width:20cqw;flex:none}
.p-plate .plate path{stroke:#003876}
.p-plate div{display:flex;flex-direction:column;gap:1cqw;font:500 3cqw/1.2 var(--body)}
.p-plate b{font:700 4.2cqw/1 var(--display)}
.p-plate i{display:inline-block;width:2.4cqw;height:2.4cqw;border-radius:50%;margin-right:1.4cqw}
.p-foot{font:700 2.6cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.3);padding-top:2cqw}
.pthumb{max-width:240px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,12,31,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.lb-in{width:min(100%,calc((100vh - 120px)*.75),520px)}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plate{width:100%;max-width:110px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.basic{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.basic:last-child{border-bottom:0}
.bnum{font:700 1.5rem/1 var(--display);color:var(--gold-text)}
ol.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
ol.rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:8px;font-weight:600;font-size:1.02rem;align-items:start}
ol.rules li::before{content:counter(r);width:26px;height:26px;border-radius:7px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font:700 .95rem var(--display)}
.bottles{display:flex;flex-wrap:wrap;gap:6px}
.btl{width:34px;height:52px;padding:2px;border:0;background:none;cursor:pointer}
.btl svg{width:100%;height:100%}
.btl path{fill:none;stroke:var(--line);stroke-width:1.6}
.btl .fill{fill:var(--gold);opacity:0;transition:opacity .2s}
.btl[aria-pressed="true"] path{stroke:var(--gold)}
.btl[aria-pressed="true"] .fill{opacity:1}

.app{position:relative;z-index:1}

/* walk-up intro */
.walkup{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 70% at 50% 110%,rgba(254,212,31,.28),transparent 60%),linear-gradient(180deg,#000C1F 0%,#001B3D 55%,#003876 100%);color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));animation:wuIn .35s ease both}

@keyframes wuIn{from{opacity:0}to{opacity:1}}
@keyframes wuOut{to{opacity:0;transform:scale(1.04)}}
.wu-field{position:absolute;inset:0;display:flex;justify-content:center;opacity:.9}
.wu-field svg{width:100%;max-width:640px;height:100%}
.wu-field .l,.wu-field .g{fill:none;stroke-dasharray:1600;stroke-dashoffset:1600;animation:wuDraw 2.6s .2s ease-out forwards}
.wu-field .l{stroke:#fff;stroke-width:2;opacity:.22}
.wu-field .g{stroke:#FED41F;stroke-width:2.6;opacity:.55}
.wu-field .gf{fill:#FED41F;opacity:0;animation:wuFade .6s 2.2s forwards}

.wu-field text{display:none}
@keyframes wuDraw{to{stroke-dashoffset:0}}
@keyframes wuFade{to{opacity:.55}}
.wu-light{position:absolute;top:-20%;width:70%;height:140%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(254,212,31,.06) 60%,transparent);filter:blur(10px);transform-origin:50% 0;pointer-events:none;mix-blend-mode:screen}
.wu-light.l1{left:-25%;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:wuSweep1 3.2s ease-in-out both}
.wu-light.l2{right:-25%;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:wuSweep2 3.2s ease-in-out both}
@keyframes wuSweep1{0%{transform:rotate(-38deg);opacity:0}30%{opacity:1}100%{transform:rotate(14deg);opacity:.75}}
@keyframes wuSweep2{0%{transform:rotate(38deg);opacity:0}30%{opacity:1}100%{transform:rotate(-14deg);opacity:.75}}
.wu-in{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px}
.wu-call{font:700 .82rem/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:#FED41F;animation:wuCall .9s .5s ease-out both}
@keyframes wuCall{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.32em}}
.wu-pos{font:600 .95rem/1.2 var(--body);opacity:.85;animation:wuUp .6s 1.1s ease-out both}
.wu-name{font:700 clamp(2.6rem,13vw,4.2rem)/.95 var(--display);color:#fff;text-shadow:0 0 30px rgba(254,212,31,.45);animation:wuName 1s 1.5s cubic-bezier(.2,.8,.2,1) both;text-wrap:balance}
@keyframes wuName{0%{opacity:0;transform:scale(1.6);filter:blur(12px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1)}}
@keyframes wuUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wu-burst{position:relative;width:150px;height:110px;display:grid;place-items:center;margin:14px 0 4px;animation:wuPop .7s 2.7s cubic-bezier(.3,1.6,.5,1) both}
.wu-burst img{width:150px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.wu-ray{position:absolute;inset:-60px;background:conic-gradient(from 0deg,transparent 0 8%,rgba(254,212,31,.35) 10%,transparent 12% 20%,rgba(254,212,31,.35) 22%,transparent 24% 33%,rgba(254,212,31,.35) 35%,transparent 37% 45%,rgba(254,212,31,.35) 47%,transparent 49% 58%,rgba(254,212,31,.35) 60%,transparent 62% 70%,rgba(254,212,31,.35) 72%,transparent 74% 83%,rgba(254,212,31,.35) 85%,transparent 87% 95%,rgba(254,212,31,.35) 97%,transparent 99%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:wuSpin 14s linear infinite}
@keyframes wuPop{from{opacity:0;transform:scale(.2) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes wuSpin{to{transform:rotate(360deg)}}
.wu-title{font:700 1.5rem/1.1 var(--display);color:#FED41F;animation:wuUp .6s 3.5s ease-out both}
.wu-tag{font:600 1rem/1.2 var(--body);opacity:.85;animation:wuUp .6s 3.9s ease-out both}

.wu-skip{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;font:600 .85rem var(--body);cursor:pointer;z-index:2}
@media (prefers-reduced-motion:reduce){.walkup *{animation:none!important}.wu-field .l,.wu-field .g{stroke-dashoffset:0}.wu-field .gf{opacity:.55}}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain;padding:2px;flex:none;box-shadow:0 0 0 1px var(--line)}
.logo.lg{width:64px;height:64px;border-radius:14px}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:3cqw}
.p-foot img{width:9cqw;height:9cqw;border-radius:2.4cqw;background:#fff;padding:.6cqw;object-fit:contain}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Mid-century modern layer: flat color fields, generous space, round geometry, Futura.
   Cypress palette only: Charger Blue + Premier Gold base; Tile Brown (walnut) and Tile Red as small accents. ===== */
:root[data-theme="mcm"]{--bg:#F2ECDF;--surface:#FBF8F1;--surface-2:#E9E1D0;--line:#DCD2BE;--fg:#003876;--muted:#6E5C44;--gold:#FED41F;--gold-text:#614219;--on-gold:#003876;--info:#1C75BC;--stop:#C8161D;--ok:#366B34;color-scheme:light}
:root{--display:Futura,"Futura PT",Jost,"Trebuchet MS",sans-serif;--r:20px}
h1{font-weight:500;letter-spacing:-.015em;font-size:2.4rem}
h2{font-weight:500;font-size:1.3rem;letter-spacing:0}
h2::before{width:12px;height:12px;border-radius:50%;transform:none;margin:0 2px;background:var(--gold)}
h3{font-weight:600}
.eyebrow{letter-spacing:.18em;font-weight:600}
.view{gap:26px}
.card,details,.sportbtn,.theme,.wkstrip button{border:0!important;box-shadow:none!important;background:var(--surface)}
.card{padding:18px}
details{border-radius:16px}
summary{padding:15px 18px}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--gold-text);border-bottom:2px solid var(--gold-text);transform:rotate(45deg);margin:4px 4px 0 0;flex:none;transition:transform .2s}
details[open] summary::after{content:"";transform:rotate(-135deg);margin-top:8px}
.mdet{background:var(--surface-2)!important;border:0!important}
.fold.flag{box-shadow:inset 4px 0 0 var(--stop)!important}
/* hero: a flat Charger Blue field with a gold sun and a thin orbit */
.hero{background:#003876!important;color:#fff;border:0;border-radius:24px;padding:24px 20px 20px}
.hero::after{content:"";clip-path:none;right:-46px;top:-46px;bottom:auto;width:150px;height:150px;border-radius:50%;background:#FED41F;opacity:1}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:250px;height:250px;border-radius:50%;border:2px solid rgba(254,212,31,.45);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .eyebrow,.hero .muted,.hero .pct small,.hero .cell span{color:rgba(255,255,255,.72)}
.hero h1{color:#fff}
.hero .chip.gold{border-color:rgba(254,212,31,.7);color:#FED41F}
.hero .cell{border-color:rgba(255,255,255,.35)}
.hero .cell[aria-pressed="true"]{background:#FED41F;border-color:#FED41F;box-shadow:none}
.hero .meter::after{background:rgba(255,255,255,.35)}
.hero .meter.full::after{background:#FED41F}
.hero.welcome::after,.hero.welcome::before{display:none}
.hero.welcome h1{text-transform:uppercase;letter-spacing:.04em}
.hero-logo{opacity:.16;right:-14%;top:auto;bottom:-22%;width:80%}
/* pills, flat */
.seg button,.choice button{border:0;background:var(--surface);padding:8px 15px}
.seg button[aria-pressed="true"],.choice button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{border-radius:999px;font-weight:600;letter-spacing:.01em}
.btn.ghost{border:0;background:var(--surface-2);color:var(--fg)}
.chip{border:0;background:var(--surface-2);color:var(--muted);font-weight:600}
.chip.stop{background:color-mix(in srgb,var(--stop) 14%,transparent);color:var(--stop)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold-text)}
input,select,textarea{border:0;background:var(--surface-2);border-radius:12px}
.goldbox,.alertbox{border-radius:16px;border-left-width:0;box-shadow:inset 5px 0 0 var(--gold)}
.alertbox{box-shadow:inset 5px 0 0 var(--stop)}
.ann{border-left:0;padding-left:0}
.ann b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle}
.cell{border-radius:999px}
.tl-dot,.mpn{border-radius:50%}
.bubble.user{border-radius:18px 18px 4px 18px}
/* calm tabs */
.tabs{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--line)}
.tabs button[aria-current="page"] svg{filter:none}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"]::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:1px}
.logo{border-radius:50%;box-shadow:none}
.avatar{border:0;background:var(--surface-2)}
/* quieter sport backgrounds */
#bg .l{opacity:.07}
#bg .g,#bg .gf{opacity:.16}
#bg .f{opacity:.04}

/* profile: a Charger locker door */
.locker{position:relative;background:#003876;color:#fff;border-radius:18px 18px 10px 10px;padding:16px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:hidden;box-shadow:inset 0 0 0 6px #0A4A8E}
.locker::before,.locker::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:#00234C}
.locker::before{left:0}.locker::after{right:0}
.lk-vents{width:62%;height:44px;background:repeating-linear-gradient(180deg,#00234C 0 5px,transparent 5px 11px);border-radius:3px;margin-top:4px}
.lk-num{font:600 4.2rem/.9 var(--display);color:transparent;-webkit-text-stroke:2px #FED41F;letter-spacing:.02em;margin:-2px 0 -4px}

/* team talk slides */
.teamtalk{position:fixed;inset:0;z-index:85;background:#003876;color:#fff;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));animation:wuIn .25s ease both}
.tt-bg{position:absolute;inset:0;display:flex;justify-content:center;opacity:.3}
.tt-bg svg{width:100%;max-width:900px;height:100%}
.tt-bg .l{fill:none;stroke:#fff;stroke-width:2;opacity:.12}.tt-bg .g{fill:none;stroke:#FED41F;stroke-width:2.5;opacity:.3}.tt-bg .gf{fill:#FED41F;opacity:.3}.tt-bg .f{fill:#fff;opacity:.05}.tt-bg text{display:none}
.tt-slide{position:relative;max-width:820px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.tt-k{font:600 .9rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#FED41F}
.tt-h{font:500 clamp(2rem,7vw,4.4rem)/1.05 var(--display);color:#fff;text-wrap:balance}
.tt-s{font:500 1.05rem/1.3 var(--body);opacity:.8}
.tt-plate .plate{width:min(52vw,260px);max-width:none}.tt-plate .plate path{stroke:#003876}
.tt-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left}
.tt-cols div{background:rgba(0,27,61,.7);border-top:4px solid #FED41F;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tt-cols b{font:600 1.2rem var(--display);color:#FED41F}.tt-cols span{font-size:1rem;line-height:1.35}
@media (max-width:560px){.tt-cols{grid-template-columns:1fr}}
.tt-nav{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:18px}
.tt-b{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.6rem;cursor:pointer}.tt-b[disabled]{opacity:.3}
.tt-dots{display:flex;gap:6px}.tt-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}.tt-dots i.on{background:#FED41F}
/* printable one-pager */
#printarea{display:none}
@media print{
 @page{size:letter;margin:.45in}
 body>*:not(#printarea){display:none!important}
 #printarea{display:block!important;color:#003876;font-family:"Trebuchet MS",Arial,sans-serif}
 .pp{display:grid;grid-template-columns:3.6in 1fr;gap:.3in;align-items:start}
 .pp-poster .poster{border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pp-side h2{font:600 20pt Futura,Jost,sans-serif;margin:0 0 6pt}.pp-side h3{font:600 11pt Futura,Jost,sans-serif;margin:10pt 0 2pt;text-transform:uppercase;letter-spacing:.06em}
 .pp-side p,.pp-side li{font-size:10.5pt;line-height:1.35;margin:0}.pp-side ul{margin:2pt 0;padding-left:14pt}
 .pp-src{font-size:8pt!important;color:#4F728F;margin-top:10pt!important}.pp-foot{font-size:9pt!important;margin-top:12pt!important;border-top:1px solid #B6B2A3;padding-top:6pt}
}
.cartbtn{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--card,#fff);color:var(--ink,#003876);box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;display:grid;place-items:center}
.cartbtn svg{width:24px;height:24px}.cartbtn[aria-pressed="true"]{background:#003876;color:#FED41F}
.cartn{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#FED41F;color:#003876;font:700 .72rem/20px var(--mono);text-align:center;padding:0 4px}
.glist{list-style:none;margin:0;padding:4px 14px}.gl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.gl:last-child{border-bottom:0}
.gl-chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;font-weight:700;color:#003876;cursor:pointer}.gl.done .gl-chk{background:#FED41F;border-color:#FED41F}
.gl-t{flex:1;display:flex;flex-direction:column;gap:2px}.gl-t span{font-size:.74rem;opacity:.65}.gl.done .gl-t b{text-decoration:line-through;opacity:.6}
.gl-ic{border:0;background:transparent;color:inherit;opacity:.55;font-size:1rem;width:30px;height:30px;cursor:pointer}
.mpnav{min-width:40px;padding:0 10px;font-size:1.3rem}

 {id:"baseball",n:"Baseball",who:"Men",kind:"skill",pos:["Pitcher","Catcher","Infield","Outfield"]},

/* Sport guides (Learn > By sport) */
const GUIDES={
 baseball:{demand:"Short, all-out bursts (sprint, throw, swing) during long games. Plus doubleheaders and long bus rides.",carbs:"Most days, about a third of your plate is carbs (rice, pasta, bread, potatoes). On doubleheader days, make it half.",game:"Eat a full meal 3–4 hours before first pitch. Then a small snack, like a banana, 30–60 minutes before.",during:"Between games, eat something easy: a sandwich, fruit, pretzels or chocolate milk. Drink every inning when it's hot.",tips:["Pitchers: eat carbs and protein within an hour after you throw.","Pack your dugout bag: water, sports drink, pretzels, PB&J, bananas and sunflower seeds for salt.","Sitting in the Orange County sun all afternoon still dries you out. Keep drinking."],src:"ACSM/AND/DC Joint Position Statement: Nutrition and Athletic Performance, 2016"},
 softball:{demand:"Fast sprints, throws and swings in short bursts, often with several games in one day.",carbs:"Most days, about a third of your plate is carbs. On tournament days, make it half.",game:"Eat a full meal 3–4 hours before. Then a snack like a banana or granola bar 30–60 minutes before.",during:"Between games, eat easy food: a turkey sandwich, fruit, crackers or yogurt. Skip big, greasy meals until you're done.",tips:["Pitchers throw a lot over a weekend. Eat between every game so you don't run out of gas.","On hot days, drink on a schedule. Don't wait until you're thirsty.","Bring a cooler. Snack-bar food usually isn't what you need."],src:"ACSM/AND/DC Joint Position Statement, 2016"},
 mbb:{demand:"Sprints, jumps and quick cuts over and over for about 40 minutes of game time.",carbs:"During the season, about a third to half of your plate is carbs.",game:"Eat a full meal 3–4 hours before (rice or pasta, chicken, vegetables). Have a carb snack 1 hour before.",during:"Drink at every timeout. At halftime, have orange slices or a sports drink if you play a lot of minutes.",tips:["Late games mean late dinners. Keep a snack in your bag for right after.","Back-to-back games? Eat carbs at every meal the next day.","Weigh yourself before and after practice to see how much you sweat."],src:"ACSM/AND/DC Joint Position Statement, 2016"},
 wbb:{demand:"Sprints, jumps and quick cuts over and over for about 40 minutes of game time.",carbs:"During the season, about a third to half of your plate is carbs.",game:"Eat a full meal 3–4 hours before (rice or pasta, chicken, vegetables). Have a carb snack 1 hour before.",during:"Drink at every timeout. At halftime, have orange slices or a sports drink if you play a lot of minutes.",tips:["All that jumping puts stress on your bones. Calcium, vitamin D and eating enough keep them strong.","Always tired? Women athletes often run low on iron. Ask for a blood test.","Late games: keep a snack in your bag for right after."],src:"ACSM/AND/DC Joint Position Statement, 2016; IOC Consensus on REDs, 2023"},
 msoc:{demand:"About 90 minutes of running with lots of sprints. Field players often run about 6 miles a game.",carbs:"On game days and hard practice days, make about half your plate carbs. On easy days, a third.",game:"Eat a big carb meal 3–4 hours before kickoff. Before a big game, eat extra carbs the day before too.",during:"At halftime, have a sports drink or a gel with water. It helps you sprint and think clearly late in the game.",tips:["Hot afternoons in Cypress: show up hydrated and drink at every break.","Goalkeepers run less. Eat for your own training, not the field players'.","After the game, eat carbs and protein within an hour, especially if you play again in two days."],src:"Collins et al., UEFA expert group statement on nutrition in elite football, Br J Sports Med 2021"},
 wsoc:{demand:"About 90 minutes of running with lots of sprints and quick cuts.",carbs:"On game days and hard practice days, make about half your plate carbs. On easy days, a third.",game:"Eat a big carb meal 3–4 hours before kickoff. Eat extra carbs the day before a big game.",during:"At halftime, have a sports drink or a gel with water.",tips:["Eat a carb snack before every practice. Running on empty raises your injury risk.","Periods and lots of running both lower iron. Always tired? Ask for a blood test.","After a sweaty game, replace water and salt."],src:"Collins et al., UEFA expert group statement, Br J Sports Med 2021; IOC Consensus on REDs, 2023"},
 wvb:{demand:"Lots of jumps, blocks and dives in long matches, with short breaks.",carbs:"Most days, about a third of your plate is carbs. On two-a-days and tournament days, make it half.",game:"Eat a full meal 3–4 hours before. Have a small carb snack 30–60 minutes before.",during:"Sip a sports drink between sets. Between matches, eat pretzels, a banana, applesauce or fruit snacks.",tips:["Jumping is hard on bones and tendons. Eat enough food and get calcium and vitamin D.","Long tournament days: pack your own food.","Eat protein at every meal to help your muscles recover."],src:"ACSM/AND/DC Joint Position Statement, 2016"},
 bvb:{demand:"Jumping and sprinting in sand, which takes more energy than a hard court, plus long days in the sun.",carbs:"On tournament days, make about half your plate carbs.",game:"Eat breakfast 3–4 hours before your first match. Have a small snack before warm-up.",during:"Between matches, get in the shade, drink fluids with salt, and eat easy carbs like a banana, pretzels or PB&J.",tips:["Sand days at Rosie's Dog Beach in Long Beach or Great Park in Irvine: bring shade, a cooler and more water than you think.","See white salt marks on your clothes? You're a salty sweater. Add salt back: a sports drink or a salty snack like pretzels.","Sunscreen and a hat help you handle the heat."],src:"ACSM Position Stand: Exercise and Fluid Replacement, 2007; ACSM/AND/DC, 2016"},
 flag:{demand:"Short sprints and sharp cuts, with short rests between plays.",carbs:"Most days, about a third of your plate is carbs. On days with more than one game, make it half.",game:"Eat a full meal 3–4 hours before. Have a carb snack 30–60 minutes before warm-up.",during:"Drink water or a sports drink between drives. Eat fruit or pretzels between games.",tips:["Eat a real meal before games. Fuel keeps your legs fresh and your cuts sharp.","Speed comes from power. Eat protein at every meal and carbs before practice.","Playing more than one game? Pack a cooler."],src:"ACSM/AND/DC Joint Position Statement, 2016"},
 mwp:{demand:"One of the hardest team sports: nonstop treading, sprinting and wrestling in the water.",carbs:"During hard training weeks, make about half your plate carbs, or more.",game:"Eat a full meal 3–4 hours before. Have a light snack 1 hour before that won't sit heavy in the pool.",during:"Keep a bottle on the pool deck. Drink between quarters. You sweat in the pool even if you can't feel it.",tips:["Two practices a day burn a lot. Eat before morning practice, even just a bagel and a banana.","Super hungry after swimming? That's normal. Plan a snack so you don't overeat later.","Your shoulders take a beating. Protein at every meal helps them repair."],src:"ACSM/AND/DC Joint Position Statement, 2016"},
 wwp:{demand:"Nonstop treading, sprinting and contact in the water.",carbs:"During hard training weeks, make about half your plate carbs, or more.",game:"Eat a full meal 3–4 hours before. Have a light snack 1 hour before.",during:"Keep a bottle on the pool deck. Drink between quarters.",tips:["Lots of pool time makes it easy to under-eat. Eat enough on two-a-day days.","Ask for a blood test to check iron and vitamin D.","Morning practice: eat something small before you get in."],src:"ACSM/AND/DC Joint Position Statement, 2016; IOC Consensus on REDs, 2023"},
 mswim:{demand:"Swimmers: lots of yards and two-a-days. Divers: short, precise power and skill, and they need less food.",carbs:"Swimmers: during hard weeks, half your plate is carbs; eat a little less during taper. Divers: about a quarter to a third.",game:"Meet day: eat a breakfast you know works. Then small snacks (bagel, banana, crackers) between events.",during:"At long meets, eat a little every hour or two. No big meals between events.",tips:["Taper means less training. Eat a bit fewer carbs, but don't cut way back on food.","Early practice? A small carb snack is better than swimming on empty.","Divers: focus on good food at the right times, not more food."],src:"Shaw et al., Nutrition for swimming, Int J Sport Nutr Exerc Metab 2014"},
 wswim:{demand:"Swimmers: lots of yards and two-a-days. Divers: short, precise power and skill, and they need less food.",carbs:"Swimmers: during hard weeks, half your plate is carbs; a little less during taper. Divers: about a quarter to a third.",game:"Meet day: eat a breakfast you know works. Then small snacks between events.",during:"At long meets, eat a little every hour or two.",tips:["Swimmers often don't eat enough for their training. Missed or irregular periods are a reason to see us and the sports medicine team.","Ask for a blood test to check iron and vitamin D.","Divers often feel pressure about body shape. Talk to us before you change how you eat."],src:"Shaw et al., Int J Sport Nutr Exerc Metab 2014; IOC Consensus on REDs, 2023"},

function plateSVG(v){
 const cols=["var(--gold)","var(--info)","var(--ok)"];let a=-90,out="";
 v.forEach((p,i)=>{const s=a*Math.PI/180,e=(a+p*3.6)*Math.PI/180,l=p>50?1:0;out+=`<path d="M50 50L${50+42*Math.cos(s)} ${50+42*Math.sin(s)}A42 42 0 ${l} 1 ${50+42*Math.cos(e)} ${50+42*Math.sin(e)}Z" fill="${cols[i]}" stroke="var(--surface)" stroke-width="2"/>`;a+=p*3.6});
 return `<svg viewBox="0 0 100 100" class="plate" role="img" aria-label="Plate: ${v[0]}% carbs, ${v[1]}% protein, ${v[2]}% fruits and veggies"><circle cx="50" cy="50" r="48" fill="none" stroke="var(--line)" stroke-width="2"/>${out}</svg>`;
}
/* Sport poster: only the athlete's own sport is shown */
const POSTER_TITLE={baseball:"Fuel the Swing",softball:"Fuel the Windmill",mbb:"Fuel the Fast Break",wbb:"Fuel the Fast Break",msoc:"Fuel the Full 90",wsoc:"Fuel the Full 90",wvb:"Fuel the Jump",bvb:"Fuel the Sand",flag:"Fuel the Cut",mwp:"Fuel the Eggbeater",wwp:"Fuel the Eggbeater",mswim:"Fuel the Wall",wswim:"Fuel the Wall",golf:"Fuel the Back Nine"};
const firstSentence=s=>{const m=String(s).match(/^.*?[.!?](\s|$)/);return (m?m[0]:s).trim()};
function posterHTML(id){
 const s=sportById(id),g=GUIDES[id];if(!s||!g)return "";
 return `<div class="poster" role="img" aria-label="${esc(POSTER_TITLE[id])} poster for ${esc(sportLabel(s))}">
  <div class="poster-bg">${bgSVG(id)}</div>
  <div class="poster-in">
   <p class="p-kicker"><span class="p-dia"></span>Cypress Chargers · ${esc(sportLabel(s))}</p>
   <h2 class="p-title">${esc(POSTER_TITLE[id])}</h2>
   <ol class="p-rules">${SIMPLE[id].map(r=>`<li>${esc(r)}</li>`).join("")}</ol>
   <div class="p-cols">
    <div><b>Before</b><span>${esc(firstSentence(g.game))}</span></div>
    <div><b>During</b><span>${esc(firstSentence(g.during))}</span></div>
    <div><b>After</b><span>Carbs + protein within an hour.</span></div>
   </div>
   <div class="p-plate">${plateSVG([50,25,25])}<div><b>Game-day plate</b><span><i style="background:var(--p-gold)"></i>½ carbs</span><span><i style="background:#00AEEF"></i>¼ protein</span><span><i style="background:#6FAF6B"></i>¼ fruits &amp; veggies</span></div></div>
   <div class="p-foot"><span>At the Clinic · Cypress College Athletics</span><img src="${LOGO}" alt="Cypress Chargers"></div>
  </div></div>`;
}
function teamTalk(id){
 const s=sportById(id),g=GUIDES[id];if(!s||!g)return;
 const slides=[`<p class="tt-k">${esc(sportLabel(s))}</p><h1 class="tt-h">${esc(POSTER_TITLE[id])}</h1><p class="tt-s">Team nutrition talk · At the Clinic</p>`,
  ...SIMPLE[id].map((r,i)=>`<p class="tt-k">Rule ${i+1} of 3</p><h1 class="tt-h">${esc(r)}</h1>`),
  `<p class="tt-k">Game-day plate</p><div class="tt-plate">${plateSVG([50,25,25])}</div><p class="tt-s">½ carbs · ¼ protein · ¼ fruits &amp; veggies</p>`,
  `<p class="tt-k">Game day</p><div class="tt-cols"><div><b>Before</b><span>${esc(firstSentence(g.game))}</span></div><div><b>During</b><span>${esc(firstSentence(g.during))}</span></div><div><b>After</b><span>Carbs + protein within an hour.</span></div></div>`,
  `<p class="tt-k">Questions?</p><h1 class="tt-h">Book a consult with ${esc(S().rdName||"the dietitian")}</h1><p class="tt-s">Through ${esc(atNames(" or "))} · RD tab in the app</p>`];
 let i=0;const el=document.createElement("div");el.className="teamtalk";el.setAttribute("role","dialog");el.setAttribute("aria-label","Team talk slides");
 const draw=()=>{el.innerHTML=`<div class="tt-bg">${bgSVG(id)}</div><div class="tt-slide">${slides[i]}</div><div class="tt-nav"><button class="tt-b" data-ttprev="1" aria-label="Previous" ${i?"":"disabled"}>‹</button><span class="tt-dots">${slides.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</span><button class="tt-b" data-ttnext="1" aria-label="Next" ${i<slides.length-1?"":"disabled"}>›</button></div><button class="wu-skip" data-ttclose="1">Close</button>`};
 el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b){if(i<slides.length-1){i++;draw()}return}if(b.dataset.ttnext&&i<slides.length-1){i++;draw()}else if(b.dataset.ttprev&&i>0){i--;draw()}else if(b.dataset.ttclose){el.remove();document.removeEventListener("keydown",key)}e.stopPropagation()});
 const key=e=>{if(e.key==="ArrowRight"&&i<slides.length-1){i++;draw()}if(e.key==="ArrowLeft"&&i>0){i--;draw()}if(e.key==="Escape"){el.remove();document.removeEventListener("keydown",key)}};
 document.addEventListener("keydown",key);draw();document.body.appendChild(el);
 try{el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(e){}
}
function printOnePager(id){

 let pa=document.getElementById("printarea");if(!pa){pa=document.createElement("div");pa.id="printarea";document.body.appendChild(pa)}
 pa.innerHTML=`<div class="pp"><div class="pp-poster">${posterHTML(id)}</div><div class="pp-side"><h2>${esc(sportLabel(s))}</h2><p>${esc(g.demand)}</p>
  <h3>How much carbs</h3><p>${esc(g.carbs)}</p><h3>Game day</h3><p>${esc(g.game)}</p><h3>During play</h3><p>${esc(g.during)}</p>
  <h3>Charger tips</h3><ul>${g.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <p class="pp-src">Source: ${esc(g.src)}</p><p class="pp-foot">At the Clinic · Book a consult with ${esc(S().rdName||"the dietitian")} through ${esc(atNames(" or "))}</p></div></div>`;
 setTimeout(()=>{try{window.print()}catch(e){toast("Printing isn't available here. Open the app in Safari.")}},50);
}

/* Women & men general guides */
const SEXGUIDES={
 women:[
  {q:"Missed or irregular periods",a:["Missing your period is not a normal part of training. It usually means you're not eating enough for how hard you train.","Over time, this can weaken your bones and raise your injury risk. Book with us and tell your athletic trainer or doctor."],s:"IOC Consensus Statement on REDs, Br J Sports Med 2023"},
  {q:"Iron",a:["Women athletes lose iron through periods, sweat and pounding on hard ground. Low iron makes you tired and slow.","Eat iron foods often (red meat, chicken, fish, beans, spinach, cereal with added iron). Eat them with vitamin C foods like oranges or peppers. Only take iron pills after a blood test."],s:"Sims et al., ISSN Position Stand: Nutritional concerns of the female athlete, 2023"},
  {q:"Your period and performance",a:["For most athletes, performance changes very little during the month. Everyone is different.","Notice a pattern, like cramps, stomach trouble, bad sleep or cravings? Write it in your Journal and we'll plan around it."],s:"McNulty et al., Sports Med 2020 (meta-analysis)"},
  {q:"Strong bones",a:["Your teens and twenties are when you build the strongest bones you'll ever have. Calcium, vitamin D, protein and enough total food all help.","More than one stress fracture? We should check what you're eating and get blood work."],s:"IOC Consensus on REDs, 2023; ACSM/AND/DC, 2016"},
  {q:"How much protein?",a:["The same as men for your size. Eat protein at every meal and snack, about 4–5 times a day.","Get some protein within a couple of hours after practice."],s:"Morton et al., Br J Sports Med 2018"},
  {q:"Pressure about your body",a:["Some sports come with pressure about body shape or uniforms. Cutting food to change your body usually hurts your play and health first.","Talk to us before you change how you eat. It stays private."],s:"IOC Consensus on REDs, 2023"}
 ],
 men:[
  {q:"Men can under-eat too",a:["Not eating enough for your training isn't just a women's problem. In men it can show up as feeling tired, low sex drive, moodiness, slow recovery and stress fractures.","It's more common in sports with lots of training or pressure about weight."],s:"IOC Consensus Statement on REDs, Br J Sports Med 2023"},
  {q:"Building muscle",a:["To build muscle you need a lifting plan, enough protein, and a little extra food. Eating way more doesn't build more muscle; it mostly adds fat.","Slow and steady weight gain adds more muscle and less fat."],s:"Iraki et al., Sports 2019; Morton et al., Br J Sports Med 2018"},
  {q:"Pre-workouts and \"boosters\"",a:["Many pre-workouts have a lot of caffeine and ingredients nobody has tested. Some \"testosterone boosters\" are banned and unsafe.","Banned or unsafe ingredients can hide in supplements without being on the label. Only use products with an NSF Certified for Sport or Informed Sport seal."],s:"IOC Consensus Statement on Dietary Supplements, 2018"},
  {q:"Sweat and salt",a:["Bigger athletes usually sweat more and lose more salt. Weigh yourself before and after practice to see how much you lose.","For every pound you lose, drink about 20–24 oz over the next few hours."],s:"ACSM Position Stand: Exercise and Fluid Replacement, 2007"},
  {q:"Alcohol",a:["Drinking after practice slows muscle repair, even if you also eat protein. It also hurts sleep and leaves you dehydrated.","If you drink, eat a full meal first, drink water in between, and keep it away from hard practices and games."],s:"Parr et al., PLoS One 2014"},
  {q:"Gaining or losing weight",a:["Changing weight fast hurts your power and recovery. Plan any change around your season, and do it with us.","Talk to us before you cut, bulk or start any supplement."],s:"ACSM/AND/DC Joint Position Statement, 2016"}
 ]
};

/* Quick answers */
const FAQ=[
 {q:"How much protein do I need?",a:["Most athletes need about 0.7 grams per pound of body weight each day. For a 150-pound athlete, that's about 110 grams.","Split it up: about 20–40 grams at each meal and snack, including one after practice. That's a chicken breast, a cup of Greek yogurt, or 3 eggs plus milk."],s:"Morton et al., Br J Sports Med 2018; ISSN Position Stand: Protein and Exercise, 2017"},
 {q:"How many carbs should I eat?",a:["Carbs (rice, pasta, bread, potatoes, fruit) are your main fuel for hard training. The harder the day, the more you need.","Easy way: on hard days, fill half your plate with carbs. On normal days, a third. On rest days, a quarter."],s:"ACSM/AND/DC Joint Position Statement, 2016; USOPC/UCCS Athlete's Plate"},
 {q:"What should I eat before practice?",a:["Eat a meal with carbs and some protein 1–4 hours before. Go light on fat and fiber so it doesn't sit heavy.","Short on time? A banana, toast with honey or a sports drink 30–60 minutes before is better than nothing."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"What should I eat after practice?",a:["Eat carbs plus 20–40 grams of protein. Chocolate milk and a sandwich work great.","This matters most when you practice again within 8 hours."],s:"ISSN Position Stand: Nutrient Timing, 2017"},
 {q:"How do I fuel a two-a-day?",a:["Right after the first practice, eat a real meal with carbs, protein and fluids.","Then have a light carb snack 30–60 minutes before the second practice."],s:"ISSN Position Stand: Nutrient Timing, 2017"},
 {q:"I'm on a tight budget. How do I eat enough?",a:["Cheap foods that fuel you: rice, oats, pasta, potatoes, tortillas, beans, eggs, peanut butter, frozen vegetables, bananas and canned tuna or chicken.","The Cypress College Food Pantry has free groceries for students. Go to Eat › Free food."],s:"USDA Thrifty Food Plan, 2021; Cypress College Basic Needs"},
 {q:"How do I know how much I sweat?",a:["Weigh yourself before and after practice in little clothing. Each pound you lose is about 16 oz of sweat. Add what you drank during practice.","To catch up, drink about 20–24 oz for every pound lost over the next few hours."],s:"ACSM Position Stand: Exercise and Fluid Replacement, 2007"},
 {q:"Do swimmers and water polo players need to drink?",a:["Yes. You sweat in the pool even though you can't feel it.","Keep a bottle on the pool deck and drink at every break."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"Water or sports drink?",a:["Water is fine for most practices under an hour. Use a sports drink when practice is long, hot or really hard, or if you sweat a lot.","White salt marks on your clothes or cramps? You may need more salt."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"How do I stay safe in the heat?",a:["Show up hydrated, drink at every break, and wear light clothes. It takes about 2 weeks to get used to training in heat.","Confusion, throwing up, passing out or a very hot body during exercise is an emergency. Call 911 and cool the athlete right away."],s:"Casa et al., NATA Position Statement: Exertional Heat Illnesses, J Athl Train 2015"},
 {q:"I'm not hungry after practice. What should I do?",a:["Drink it instead: a smoothie or chocolate milk gives you carbs, protein and fluid.","Eat a real meal when your appetite comes back."],s:"Pritchett & Pritchett, Med Sport Sci 2012"},
 {q:"Should I eat protein before bed?",a:["A protein snack before bed (Greek yogurt, cottage cheese or milk) helps your muscles repair overnight.","This helps most on heavy lifting days."],s:"Res et al., Med Sci Sports Exerc 2012; Snijders et al., J Nutr 2015"},
 {q:"Is keto or low-carb good for sports?",a:["Not for most sports. Sprinting, jumping and hard efforts run on carbs.","Studies of top athletes found low-carb diets made performance worse."],s:"Burke et al., J Physiol 2017"},
 {q:"Does caffeine help?",a:["A moderate amount about an hour before can help a little with power and focus. It affects everyone differently, and late caffeine hurts sleep.","Try it at practice first. Never try it for the first time on game day."],s:"ISSN Position Stand: Caffeine and Exercise Performance, 2021"},
 {q:"Is creatine safe?",a:["Creatine is one of the most tested supplements. It helps with repeated sprints and lifting. Some people gain 2–4 pounds of water weight.","Studies don't show it causes cramps or dehydration. Only use a product tested by NSF Certified for Sport or Informed Sport, and check with {rd} first."],s:"ISSN Position Stand: Creatine, 2017; Antonio et al., J Int Soc Sports Nutr 2021"},
 {q:"How do I know if a supplement is safe?",a:["Nobody checks supplements for safety before they're sold. Some have banned drugs that aren't on the label.","Only use products with an NSF Certified for Sport or Informed Sport label, and check with {rd} first."],s:"IOC Consensus Statement on Dietary Supplements, 2018"},
 {q:"How do I raise my iron?",a:["Eat iron foods often: red meat, chicken, fish, beans, lentils, tofu, cereal with added iron. Eat them with vitamin C foods like oranges, strawberries or peppers.","Don't drink coffee or tea with those meals. Only take iron pills after a blood test."],s:"IOC Consensus on Dietary Supplements, 2018"},
 {q:"Do I need vitamin D?",a:["Vitamin D helps your bones, muscles and immune system. Indoor and pool athletes and people with darker skin are more likely to be low.","Get a blood test before you take it."],s:"IOC Consensus on Dietary Supplements, 2018"},
 {q:"I'm vegetarian or vegan. What should I watch?",a:["You can play at a high level without meat. Make sure you get enough protein from soy, beans, lentils and grains.","Vegans need vitamin B12 from a pill or foods with B12 added. Iron, zinc, calcium and omega-3s are worth checking too."],s:"Rogerson, J Int Soc Sports Nutr 2017"},
 {q:"Are energy drinks OK?",a:["Many have as much caffeine as 2–3 cups of coffee, plus untested ingredients. It's easy to get too much.","If you use caffeine, keep the amount small and don't have it late in the day."],s:"ISSN Position Stand: Energy Drinks, 2013"},
 {q:"What about peptides like BPC-157?",a:["Most peptides sold online for healing or recovery haven't been tested in people and aren't FDA-approved.","Products sold online often aren't pure or clean. \"Research use only\" means it's not safe to take. Don't use them."],s:"FDA drug review process; IOC Consensus Statement on Dietary Supplements, 2018"},
 {q:"My stomach gets upset on game day. What helps?",a:["Eat foods you know, 3–4 hours before. Close to warm-up, pick foods low in fat and fiber.","Nerves slow digestion. Drinks and small carb snacks usually sit better."],s:"ACSM/AND/DC Joint Position Statement, 2016"}

  lift:{plate:"Normal-day plate: ⅓ carbs, ⅓ protein, ⅓ fruits and veggies.",m:[["Breakfast","Carbs + protein."],["Pre-lift","1–2 hours before: light meal or snack with carbs."],["Post-lift","Protein + carbs within 2 hours."],["Dinner","Full plate."],["Before bed","Protein snack: Greek yogurt, cottage cheese or milk."]]},

 };

/* ============ hydration ============ */
let H=store.get("hydro",{});
let BOTTLE=+store.get("bottle",24)||24;
const BOTTLE_SIZES=[12,16,17,20,24,26,32,40,64];
function hydroDay(){const t=isoToday();return H[t]||(H[t]={n:0,hrs:2,cond:"warm"})}
function hydroGoal(h){
 const sp=sportById(profile.sport);
 const base=sp&&sp.who==="Men"?100:74; /* IOM beverage share of Adequate Intake: about 3.0 L men, 2.2 L women */
 const perHr={cool:16,warm:24,hot:32,pool:20}[h.cond]||24;
 return base+perHr*h.hrs;
}
function vHydro(){
 const h=hydroDay(), goal=hydroGoal(h), need=Math.ceil(goal/BOTTLE), oz=h.n*BOTTLE;
 const slots=Math.max(need,h.n);
 return `<section><h2>Hydration</h2><div class="card stack">
  <div class="row" style="align-items:flex-end"><div class="grow"><p class="eyebrow">Today</p><div class="pct">${oz}<small> / ${goal} oz</small></div></div><span class="chip ${h.n>=need?"ok":"gold"}">${h.n}/${need} bottles</span></div>
  <div class="bottles" role="group" aria-label="Bottles, ${BOTTLE} oz each">${Array.from({length:slots},(_,i)=>`<button class="btl" data-btl="${i}" aria-pressed="${i<h.n}" aria-label="Bottle ${i+1}"><svg viewBox="0 0 24 40"><path d="M9 2h6v4l3 4v26a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V10l3-4z"/><rect class="fill" x="7.5" y="14" width="9" height="22.5" rx="1"/></svg></button>`).join("")}</div>
  <label class="row" for="bottle-size" style="gap:10px;align-items:center"><span class="stamp grow">My bottle holds</span><select id="bottle-size" data-bottle="1" style="width:auto">${BOTTLE_SIZES.map(v=>`<option value="${v}" ${v===BOTTLE?"selected":""}>${v} oz${v===17?" (500 mL)":v===32?" (1 qt)":""}</option>`).join("")}</select></label>
  <details class="mdet"><summary>Adjust for training and heat</summary><div class="ans">
  <div class="stack" style="gap:6px"><span class="eyebrow">Training today</span><div class="choice">${[0,1,2,3,4].map(v=>`<button data-hhrs="${v}" aria-pressed="${h.hrs===v}">${v===4?"4+ hrs":v+" hr"+(v===1?"":"s")}</button>`).join("")}</div></div>
  <div class="stack" style="gap:6px"><span class="eyebrow">Conditions</span><div class="choice">${[["cool","Cool"],["warm","Warm"],["hot","Hot (85°F+)"],["pool","Pool"]].map(([v,l])=>`<button data-hcond="${v}" aria-pressed="${h.cond===v}">${l}</button>`).join("")}</div></div></div></details>
  <p class="small">Pale-yellow pee = good. Dark = drink more.</p>
  <p class="src">Starting goal; a sweat test gives your real number. IOM 2005; ACSM 2007</p>
 </div></section>`;
}

/* ============ game-day countdown ============ */
const KICK={skill:"First pitch",interval:"Tip-off",power:"First serve",aquatic:"First whistle",golf:"Tee time"};
function kickWord(sp){if(!sp)return "Game time";if(sp.id.includes("soc")||sp.id==="flag")return "Kickoff";if(sp.id==="tennis")return "First serve";if(sp.id.includes("swim"))return "First race";return KICK[sp.kind]||"Game time"}
const GAMELEN={skill:180,interval:120,power:120,aquatic:90,golf:300};
function fmtClock(d){return d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function fmtLeft(ms){const m=Math.max(0,Math.round(ms/60000));const h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`}
function vCountdown(c){
 const sp=sportById(profile.sport), kw=kickWord(sp);
 const head=`<div class="row"><h2 class="grow">Game clock</h2></div>`;
 if(!c.gameTime)return `<section>${head}<div class="card stack"><p>What time is ${kw.toLowerCase()}? Set it and I'll build your fueling clock backward from it.</p>
  <label for="gtime">${esc(kw)}<input id="gtime" type="time"></label></div></section>`;
 const [hh,mm]=c.gameTime.split(":").map(Number); const T=new Date(); T.setHours(hh,mm,0,0);
 const len=(GAMELEN[sp?.kind]||120)*60000, now=Date.now();
 const steps=[[-210,"Pre-game meal","Rice or pasta, lean protein. Low fat, low fiber. Eat it now, not later."],[-90,"Drink up","16–20 oz of fluid over the next hour."],[-45,"Top-off","Small carb snack: banana, pretzels, applesauce."],[-15,"Last sips","A few gulps. Then go to work."],[0,kw,"Fuel at every break."],[len/60000,"Recovery window","Carbs + protein within an hour. Don't skip it."]]
  .map(([m,t,d])=>({at:new Date(T.getTime()+m*60000),t,d}));
 const next=steps.find(s=>s.at.getTime()>now);
 const toKick=T.getTime()-now;
 return `<section>${head}<div class="card stack gameclock">
  <div class="row" style="align-items:flex-end"><div class="grow"><p class="eyebrow">${toKick>0?esc(kw)+" in":"Game on"}</p><div class="pct">${toKick>0?fmtLeft(toKick):"GO"}</div></div><button class="btn ghost sm" data-gclear="1">Change time</button></div>
  <button class="btn block" data-gcaltoday="1">Add alerts to my calendar</button>
  ${next?`<div class="goldbox"><b>Next: ${esc(next.t)} at ${fmtClock(next.at)}</b><p class="small">${esc(next.d)}</p></div>`:`<p class="muted small">All done. Get your recovery meal in.</p>`}
  <div class="tl">${steps.map(s=>{const done=s.at.getTime()<=now;return `<div class="tl-item ${done?"done":""}"><span class="tl-dot"></span><div><b>${fmtClock(s.at)} · ${esc(s.t)}</b><span class="muted small">${esc(s.d)}</span></div></div>`}).join("")}</div>
  <p class="src">Source: ACSM/AND/DC Joint Position Statement, 2016; ISSN Position Stand: Nutrient Timing, 2017</p></div></section>`;
}
/* Games: athletes add their own (or teams get schedules in cy-data "schedules"); each can go to the phone calendar with alerts. */
let GAMES=store.get("games",[]);
function teamSchedule(){const L=(DATA.schedules&&DATA.schedules[profile.sport])||[];return L.map(g=>({date:g.d,time:g.t||"",opp:g.opp||"",away:!!g.away,loc:g.loc||"",src:"team"}))}
function upcomingGames(){const today=isoToday();const all=[...teamSchedule(),...GAMES.map(g=>({...g,src:"mine"}))].filter(g=>g.date>=today);
 const seen=new Set();return all.filter(g=>{const k=g.date+g.time;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function icsEsc(s){return String(s||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function icsFor(games){const sp=sportById(profile.sport),len=(GAMELEN[sp?.kind]||120),kw=kickWord(sp);
 const pad=n=>String(n).padStart(2,"0"),stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
 const loc=d=>{const [y,m,dd]=d.date.split("-");const [h,mi]=(d.time||"15:00").split(":");return {y,m,dd,h,mi}};
 const ev=games.map((g,i)=>{const s=loc(g);const st=new Date(+s.y,+s.m-1,+s.dd,+s.h,+s.mi);const en=new Date(st.getTime()+len*6e4);

const MPWORDS={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
function mpQty(s){let m=s.match(/^(\d+)\s+(\d+)\/(\d+)\s+(.*)$/);if(m)return [+m[1]+m[2]/m[3],m[4]];
  m=s.match(/^(\d+)\/(\d+)\s+(.*)$/);if(m)return [m[1]/m[2],m[3]];m=s.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);if(m)return [+m[1],m[2]];
  m=s.match(/^([A-Za-z]+)\s+(.*)$/);if(m&&MPWORDS[m[1].toLowerCase()])return [MPWORDS[m[1].toLowerCase()],m[2]];return [null,s]}
function mpFmt(q){const w=Math.floor(q+1e-9),f=Math.round((q-w)*4)/4,fr={0.25:"1/4",0.5:"1/2",0.75:"3/4"}[f]||"";if(f===1)return String(w+1);return w&&fr?w+" "+fr:w?String(w):fr||String(Math.round(q*100)/100)}

  if(MPB.one==null||!S.r[MPB.one]){const fits=r=>!r.a.some(a=>al.includes(a));let ok=S.r.findIndex(r=>fits(r)&&isRec(r));if(ok<0)ok=S.r.findIndex(fits);MPB.one=ok<0?0:ok}
  const sel=[MPB.one],need=MPB.days*MPB.mpd;if(!sel.length)return {S,sel,need,batches:[],days:[],spare:0,list:[]};
  const per=MPB.size==="rest"?5:4,B=Math.ceil(need/per),batches=sel.map(()=>0);for(let i=0;i<B;i++)batches[i%sel.length]++;
  const left=batches.map(b=>b*per),t=isoToday(),days=[];let prev=-1;
  for(let d=0;d<MPB.days;d++){const meals=[];for(let m=0;m<MPB.mpd;m++){
      const avoid=new Set([prev,...meals.map(x=>sel.indexOf(x))]);let best=-1;
      sel.forEach((_,j)=>{if(left[j]>0&&!avoid.has(j)&&(best<0||left[j]>left[best]))best=j});
      if(best<0)sel.forEach((_,j)=>{if(left[j]>0&&(best<0||left[j]>left[best]))best=j});
      left[best]--;meals.push(sel[best]);prev=best}
    days.push({iso:isoShift(t,d),meals,freeze:d>=3})}
  const agg={},order=[];sel.forEach((ri,j)=>{if(!batches[j])return;S.r[ri].g.forEach(line=>{const [q,rest]=mpQty(line),key=rest.toLowerCase();
    if(!agg[key]){agg[key]={rest,q:0,plain:q==null};order.push(key)}if(q!=null)agg[key].q+=q*batches[j];else agg[key].plain=true})});
  const plur=(q,r)=>q>1?r.replace(/^(cup|pint|jar|bag|can|clove|bunch|head|block|package|box|bottle)\b/i,"$1s").replace(/^(rotisserie chicken|onion|red onion|lemon|lime|cucumber|carrot|avocado|bell pepper|egg|whole-grain roll|pita bread|naan bread)(?=$| \()/i,"$1s"):r;
  order.forEach(k=>{const a=agg[k];if(a.q>=4&&a.q%4===0&&/^tbsp /.test(a.rest)){a.q=a.q/16;a.rest=a.rest.replace(/^tbsp/,"cup")}});
  const list=order.map(k=>{const a=agg[k];return a.q?`${mpFmt(a.q)}${/^\d/.test(a.rest)?" ×":""} ${plur(a.q,a.rest)}`:a.rest});
  return {S,sel,need,batches,days,spare:B*per-need,list,per}}

 if(d.ackgo){profile.ack=true;store.set("profile",profile);draft.session="Onboarding & allergy review";go("rd");return}
 if(d.cell!==undefined){const t=isoToday();const c=charge[t]||(charge[t]={type:"practice",done:[]});const i=+d.cell;const k=c.done.indexOf(i);k<0?c.done.push(i):c.done.splice(k,1);
  Object.keys(charge).forEach(x=>{if(x<isoShift(t,-14))delete charge[x]});store.set("charge",charge);pushCharge();render();if(c.done.length===5)toast("Fully charged. Now go to work.");return}
 if(d.btl!==undefined){const h=hydroDay();const i=+d.btl;h.n=(i<h.n)?i:i+1;store.set("hydro",H);render();const need=Math.ceil(hydroGoal(h)/BOTTLE);if(h.n===need)toast("Goal hit. Stay on it.");return}
 if(d.hhrs!==undefined){hydroDay().hrs=+d.hhrs;store.set("hydro",H);render();return}
 if(d.hcond){hydroDay().cond=d.hcond;store.set("hydro",H);render();return}
 if(d.gadd){draft.addGame=true;draft.gAway=false;render();return}
 if(d.gcancel){draft.addGame=false;render();return}
 if(d.gaway!==undefined){draft.gAway=d.gaway==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
 if(d.gcal!==undefined){const g=upcomingGames()[+d.gcal];if(g)downloadICS([g],"chargers-"+g.date+".ics");return}
 if(d.gcalall){downloadICS(upcomingGames(),"chargers-games.ics");return}
 if(d.gcaltoday){const c=charge[isoToday()];if(c&&c.gameTime)downloadICS([{date:isoToday(),time:c.gameTime,opp:"",away:false}],"chargers-today.ics");return}
 if(d.gdel){const [dd,tt]=d.gdel.split("|");GAMES=GAMES.filter(g=>!(g.date===dd&&g.time===tt));store.set("games",GAMES);render();return}
 if(d.gclear){const c=charge[isoToday()];if(c){delete c.gameTime;store.set("charge",charge)}render();return}
 if(d.board!==undefined){prefs.noBoard=d.board==="0";store.set("prefs",prefs);pushCharge();render();return}
 if(d.bagocc){bag.occ=d.bagocc;render();return}
 if(d.baghot){bag.hot=!bag.hot;render();return}
 if(d.bagcopy){const txt="Snack bag: "+sportLabel(sportById(bag.sport||profile.sport))+"\n"+bagItems().map(x=>(bagChecked[x.t]?"[x] ":"[ ] ")+x.t).join("\n");document.getElementById("bagout").innerHTML=`<div class="copybox" id="bagtxt" style="margin-top:8px">${esc(txt)}</div><button class="btn ghost block" data-copy="bagtxt" style="margin-top:8px">Copy</button>`;try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(e){}return}
 if(d.poster){const lb=document.createElement("div");lb.className="lightbox";lb.setAttribute("role","dialog");lb.setAttribute("aria-label","Poster");lb.innerHTML=`<div class="lb-in">${posterHTML(d.poster)}</div><button class="btn" data-closelb="1">Close</button>`;document.body.appendChild(lb);return}
 if(d.closelb){b.closest(".lightbox").remove();return}
 if(d.aistart){askAI(d.aistart);return}
 if(d.aiclear){draft.chat=[];render();return}
 if(d.dt){const t=isoToday();const c=charge[t]||(charge[t]={type:"practice",done:[]});c.manual=true;if(c.type!==d.dt){c.type=d.dt;c.done=[]}store.set("charge",charge);pushCharge();render();return}
 if(d.setrehab){const t=isoToday();charge[t]={type:"rehab",done:[]};store.set("charge",charge);toast("Today is set to Rehab day");go("home");return}
 if(d.sportguide){learnSeg="sports";draft.guide=d.sportguide;tab="learn";render();window.scrollTo(0,0);return}
 if(d.guideback){draft.guide=null;render();return}
 if(d.eatseg){eatSeg=d.eatseg;if(tab!=="eat")go("eat");else render();return}
 if(d.learnseg){learnSeg=d.learnseg;draft.guide=null;render();return}
 if(d.sexseg){sexSeg=d.sexseg;render();return}
 if(d.copy){const el=document.getElementById(d.copy);try{await navigator.clipboard.writeText(el.textContent);toast("Copied")}catch(e){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it from the menu")}return}
 if(tab==="eat"){if(glistClick(b))return;if(eatSeg==="prep"&&mpClick(b))return;
  if(d.mpopen){const [k,n]=d.mpopen.split("|");MPB.store=k;const S2=mpStoreObj();const i=S2.r.findIndex(r=>r.n===n);if(i>=0)MPB.one=i;mpbSave();eatSeg="prep";render();scrollTo(0,0);return}}
 if(tab==="eat"&&eatSeg==="plan"&&planClick(b))return;
 if(d.teamtalk){teamTalk(d.teamtalk);return}
 if(d.print){printOnePager(d.print);return}
 if(d.wuclose){closeWalkup();return}
 if(d.a2later){try{sessionStorage.setItem("cy_a2hs_later","1")}catch(e){}closeA2hs();return}
 if(d.a2done){store.set("a2hs_done",1);closeA2hs();toast("Nice. Open it from your Home Screen.");return}
 if(d.a2install){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(r=>{if(r&&r.outcome==="accepted")store.set("a2hs_done",1)}).catch(()=>{});deferredInstall=null}closeA2hs();return}
 if(d.a2show){a2hs(true);return}
 if(d.wcopy){try{const r=await fetch("widget.js",{cache:"no-store"});if(!r.ok)throw 0;const s=await r.text();await navigator.clipboard.writeText(s);toast("Copied. Paste it in Scriptable.")}catch(e){toast("Open the widget page and copy the script");setTimeout(()=>{location.href="widget.js"},900)}return}
 if(d.walkup){walkup();return}
 if(d.trainseg){trainSeg=d.trainseg;render();window.scrollTo(0,0);return}
 if(d.part){bodyPart=d.part;render();return}
 if(d.injurylink){learnSeg="injury";go("learn");return}
 if(d.reset){draft[d.reset]="";if(d.reset==="atSent")draft.pain="";render();return}
 if(d.theme){prefs.theme=d.theme;store.set("prefs",prefs);render();return}
 if(d.large!==undefined){prefs.large=+d.large;store.set("prefs",prefs);render();return}
 if(d.wipe){draft.wipeAsk=true;render();return}
 if(d.wipeno){draft.wipeAsk=false;render();return}
 if(d.wipeyes){try{["profile","prefs","charge","journal","hydro","planpref","a2hs_done"].forEach(k=>localStorage.removeItem("cy_"+k))}catch(e){}profile=null;J={days:{}};charge={};prefs={theme:"mcm",large:0,mcm:1};draft={};tab="home";render();return}
 /* journal */
 if(d.jday){jDay=isoShift(jDay,+d.jday);if(jDay>isoToday())jDay=isoToday();draft.jEdit=null;render();return}
 if(d.qlocc){draft.ql.occ=d.qlocc;render();return}
 if(d.qlfood){const L=draft.ql.foods,i=L.indexOf(d.qlfood);i<0?L.push(d.qlfood):L.splice(i,1);render();return}
 if(d.qlgut){draft.ql.gut=draft.ql.gut===d.qlgut?"":d.qlgut;render();return}
 if(d.qllog||d.jrepeat){const q=draft.ql||{occ:qlDefaultOcc(),foods:[],gut:""};const n=new Date();const what=d.jrepeat||q.foods.join(", ");if(!what)return;
  const list=J.days[jDay]||(J.days[jDay]=[]);list.push({id:Date.now().toString(36),time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),occ:d.jrepeat?qlDefaultOcc():q.occ,what,gut:d.jrepeat?"":q.gut,energy:"",note:"",photo:""});
  if(!store.set("journal",J)){toast("Phone storage is full");return}draft.ql=null;render();toast("Logged.");return}
 if(d.jnew){const n=new Date();draft.jEdit={time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),occ:"",what:"",gut:"",energy:"",note:"",photo:""};draft.jDelAsk=false;render();return}
 if(d.jopen){draft.jEdit=clone((J.days[jDay]||[]).find(x=>x.id===d.jopen));draft.jDelAsk=false;render();window.scrollTo(0,0);return}
 if(d.jcancel){draft.jEdit=null;render();return}
 if(d.jrmphoto){readJForm();draft.jEdit.photo="";render();return}
 if(d.jdel){readJForm();draft.jDelAsk=true;render();return}
 if(d.jdelyes){J.days[jDay]=(J.days[jDay]||[]).filter(x=>x.id!==draft.jEdit.id);store.set("journal",J);draft.jEdit=null;render();toast("Entry deleted");return}
 if(d.jshare){const list=(J.days[jDay]||[]).slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const txt=`Food journal: ${profile.name} (${sportLabel(sportById(profile.sport))})\n${fmtDate(jDay)}\n\n`+list.map(x=>`${x.time||""} ${x.occ||""}: ${x.what}${x.gut?` | stomach ${x.gut}`:""}${x.energy?` | energy ${x.energy}`:""}${x.note?` | ${x.note}`:""}`).join("\n");
  document.getElementById("jshare").innerHTML=`<div class="copybox" id="jcopy">${esc(txt)}</div><button class="btn block" data-copy="jcopy" style="margin-top:8px">Copy</button>`;return}
 /* editor */
 if(d.edseg){edSeg=d.edseg;render();return}
 if(d.edadd){if(d.edadd==="announcements")ED.announcements.unshift({t:"",d:"",when:isoToday()});else ED.places.push({g:"Near campus",n:"",where:"",train:"",light:"",a:[]});render();return}
 if(d.edrm){const ks=d.edrm.split(".");ED[ks[0]].splice(+ks[1],1);render();return}
 if(d.edg!==undefined){ED.places[+d.edg].g=d.v;render();return}
 if(d.edal!==undefined){const a=ED.places[+d.edal].a||(ED.places[+d.edal].a=[]);const i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1);render();return}
 if(d.eddiscard){ED=null;render();toast("Edits discarded");return}
 if(d.publish){b.disabled=true;b.textContent="Publishing…";await publishData();b.disabled=false;b.textContent="Publish changes";return}
});
document.addEventListener("input",ev=>{
 const t=ev.target;
 if(t.dataset.ed&&ED){setPath(ED,t.dataset.ed,t.value);return}
 if(t.id==="q"){draft.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}
});
document.addEventListener("change",async ev=>{
 const t=ev.target;
 if(t.dataset&&t.dataset.bottle){BOTTLE=+t.value||24;store.set("bottle",BOTTLE);shareSoon();render();toast("Bottle set to "+BOTTLE+" oz");return}
 if(t.dataset&&t.dataset.areapick){profile.area=t.value;store.set("profile",profile);render();toast(myArea()?"Showing picks near "+myArea().short:"Area saved");return}
 if(t.id==="f-sport"){readOnboard();draft.p.position="";render();return}
 if(t.id==="gtime"&&t.value){const k=isoToday();const c=charge[k]||(charge[k]={type:"game",done:[]});c.gameTime=t.value;store.set("charge",charge);t.blur();render();return}
 if(t.id==="bag-sport"){bag.sport=t.value;render();return}
 if(t.dataset&&t.dataset.bagck){bagChecked[t.dataset.bagck]=t.checked;return}
 if(t.id==="j-photo"&&t.files&&t.files[0]){readJForm();try{draft.jEdit.photo=await compress(t.files[0])}catch(e){toast("Couldn't read that photo")}render();return}
});
document.addEventListener("submit",ev=>{
 ev.preventDefault();const f=ev.target;
 if(f.id==="f-onboard"){
  const isNew=!profile;
  readOnboard();const p=draft.p;p.name=(p.name||"").trim();p.other=(p.other||"").trim();
  if(p.role==="staff"){p.position="";p.num=""}else p.title="";
  if(!p.first||!p.last||!p.sport){toast(p.role==="staff"?"Add your first and last name and team":"Add your first and last name and sport");return}
  if(!p.consentAt){toast("Check the box to continue");return}
  const changedAllergy=!profile||JSON.stringify(profile.allergies)!==JSON.stringify(p.allergies)||(profile.other||"")!==p.other;
  if(changedAllergy)p.ack=false;
  profile=p;store.set("profile",profile);pushCharge();rosterSync();draft.editingProfile=false;draft.p=null;tab="home";render();window.scrollTo(0,0);if(isNew)walkup();return;
 }
 if(f.id==="f-rd"){
  const sp=sportById(profile.sport);const note=document.getElementById("rd-note").value.trim();
  draft.rdSent=`Hi ${atNames(" and ")}, I'd like to book a nutrition consult with ${rdName()}.\n\nName: ${profile.name}\n${isStaff()?"Role: "+(profile.title||"Staff")+"\nTeam: "+teamLabel():"Sport: "+sportLabel(sp)}${profile.position?`\nPosition: ${profile.position}`:""}\nSession: ${draft.session||"Not sure yet"}${myAllergens().length||profile.other?`\nAllergies/medical diet: ${[...myAllergens(),profile.other].filter(Boolean).join(", ")}`:""}${note?`\nNotes: ${note}`:""}`;
  render();return;
 }
 if(f.id==="f-at"){
  const sp=sportById(profile.sport);
  draft.atSent=`Injury report\n\nName: ${profile.name}\n${isStaff()?"Role: "+(profile.title||"Staff")+"\nTeam: "+teamLabel():"Sport: "+sportLabel(sp)}${profile.position?` (${profile.position})`:""}\nWhat hurts: ${document.getElementById("at-where").value.trim()}\nWhen/how: ${document.getElementById("at-when").value.trim()||"-"}\nPain (0-10): ${draft.pain||"-"}\nOther: ${document.getElementById("at-note").value.trim()||"-"}`;
  render();return;
 }
 if(f.id==="glist-form"){const i=document.getElementById("gl-new"),v=(i.value||"").trim();if(!v){i.focus();return}glistAdd(v.split(/\s*[,;]\s*|\n/),"Added by you");render();const n=document.getElementById("gl-new");if(n)n.focus();return}
 if(f.id==="f-code"){const v=document.getElementById("code-in").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(v&&(v.length<3||v.length>6)){toast("Codes are 3 to 6 letters or numbers.");return}if(!v||v===nameCode())delete profile.codeOverride;else profile.codeOverride=v;store.set("profile",profile);draft.codeEdit=false;rosterSync();render();toast("Code saved.");return}
 if(f.id==="f-game"){const date=document.getElementById("g-date").value,time=document.getElementById("g-time").value,opp=document.getElementById("g-opp").value.trim();if(!date||!time)return;
  GAMES.push({date,time,opp,away:!!draft.gAway});store.set("games",GAMES);draft.addGame=false;
  if(date===isoToday()){const c=charge[date]||(charge[date]={type:"game",done:[]});c.type="game";c.gameTime=time;store.set("charge",charge)}
  render();toast("Saved. Tap + Calendar for alerts.");return}
 if(f.id==="f-ai"){const q=document.getElementById("ai-q").value.trim();if(q)askAI(q);return}
 if(f.id==="f-j"){
  readJForm();const e=draft.jEdit;if(!e.what.trim()){toast("Add what you ate");return}
  const list=J.days[jDay]||(J.days[jDay]=[]);
  if(e.id){const i=list.findIndex(x=>x.id===e.id);list[i]=e}else{e.id=Date.now().toString(36);list.push(e)}
  if(!store.set("journal",J)){toast("Phone storage is full. Remove photos from older entries.");return}
  draft.jEdit=null;render();toast("Logged.");return;
 }
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)||h==="me"){tab=h;render()}});
render();
setTimeout(()=>a2hs(),1500);
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!/claude|anthropic/.test(location.hostname)){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
